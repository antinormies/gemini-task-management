name: Backend CI/CD

on:
  pull_request:
    branches: [development]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
      - "deploy/**"
  push:
    branches: [development, master]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
      - "deploy/**"

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint and test (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -e ".[dev]"
      - name: Lint
        run: |
          ruff format --check .
          ruff check .
      - name: Test
        run: pytest -q

  build:
    name: Build (push)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -e ".[dev]"
      - name: Lint
        run: |
          ruff format --check .
          ruff check .
      - name: Test
        run: pytest -q
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist
      - name: Remove build cache (development only)
        if: github.ref == 'refs/heads/development'
        run: |
          rm -rf dist build .pytest_cache .ruff_cache
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -rf "$HOME/.cache/pip"
          echo "Build artifacts and caches removed."

  deploy:
    name: Deploy (master)
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      APP_DIR: /home/deploy/antaratask/backend
      SERVICE: antaratask-backend
      PORT: "8765"
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      GTM_ENV_FILE: ${{ secrets.GTM_ENV_FILE }}
      GTM_SECRET_KEY: ${{ secrets.GTM_SECRET_KEY }}
      GTM_AI_API_KEY: ${{ secrets.GTM_AI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH key
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Ensure app directory
        run: |
          ssh -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "mkdir -p '$APP_DIR'"
      - name: Sync backend
        run: |
          rsync -az --delete \
            --exclude '.env' \
            --exclude '.venv' \
            --exclude 'data' \
            --exclude '*.db' \
            --exclude '__pycache__' \
            --exclude '.pytest_cache' \
            --exclude '.ruff_cache' \
            --exclude 'dist' \
            --exclude 'build' \
            --exclude '*.egg-info' \
            -e "ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -p $VPS_PORT" \
            backend/ "$VPS_USER@$VPS_HOST:$APP_DIR/"
      - name: Prepare server environment
        run: |
          if ssh -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "test -f '$APP_DIR/.env'"; then
            echo "Server .env exists; leaving it untouched."
            exit 0
          fi
          if [ -n "${GTM_ENV_FILE:-}" ]; then
            printf '%s\n' "$GTM_ENV_FILE" > /tmp/antaratask.env
          else
            if [ -z "${GTM_AI_API_KEY:-}" ]; then
              echo "::error::Set the GTM_AI_API_KEY secret (the app client plaintext key) or GTM_ENV_FILE."
              exit 1
            fi
            SECRET="${GTM_SECRET_KEY:-$(openssl rand -hex 32)}"
            umask 077
            cat > /tmp/antaratask.env <<EOF
          GTM_HOST=127.0.0.1
          GTM_PORT=8765
          GTM_PUBLIC_ORIGIN=https://antaratask.dream-team.works
          GTM_TIMEZONE=Asia/Jakarta
          GTM_SECRET_KEY=$SECRET
          GTM_AI_ENABLED=true
          GTM_AI_BASE_URL=https://gateway.dream-team.works/v1/chat/stream
          GTM_AI_API_KEY=$GTM_AI_API_KEY
          GTM_AI_MODEL=deepseek-v4.1-flash
          GTM_AI_CAPABILITY=chat.standard
          GTM_AI_MAX_OUTPUT_TOKENS=1024
          GTM_AI_TIMEOUT_SECONDS=120
          GTM_VOICE_ENABLED=true
          EOF
          fi
          chmod 600 /tmp/antaratask.env
      - name: Install server environment if missing
        run: |
          if ! ssh -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "test -f '$APP_DIR/.env'"; then
            scp -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -P "$VPS_PORT" /tmp/antaratask.env "$VPS_USER@$VPS_HOST:/tmp/antaratask.env"
            ssh -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "install -m 600 /tmp/antaratask.env '$APP_DIR/.env'"
          fi
      - name: Deploy
        run: |
          scp -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -P "$VPS_PORT" deploy/remote-deploy.sh "$VPS_USER@$VPS_HOST:/tmp/antaratask-remote-deploy.sh"
          ssh -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "APP_DIR='$APP_DIR' SERVICE='$SERVICE' PORT='$PORT' bash /tmp/antaratask-remote-deploy.sh"
